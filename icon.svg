<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="rounded-bg">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="100%" stop-color="#e0241a"/>
    </linearGradient>
    <linearGradient id="long-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#rounded-bg)">
    <!-- Basis-Hintergrund -->
    <rect width="512" height="512" fill="url(#bg-grad)"/>
    
    <!-- 45-Grad Long Shadow vom Erste-Hilfe-Kreuz bis zur rechten unteren Ecke -->
    <polygon points="288,128 560,400 560,560 400,560 128,288 224,288 224,224 288,224" fill="url(#long-shadow)"/>
    <polygon points="384,224 560,400 560,560 400,560 224,384" fill="url(#long-shadow)"/>
    
    <!-- Weißes Erste-Hilfe-Kreuz -->
    <path d="M224 128h64v96h96v64h-96v96h-64v-96h-96v-64h96z" fill="#ffffff"/>
  </g>
</svg>
